name: Deploy HÁBITAT

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/habitat

            echo "==> Descargando versión de GitHub"
            git fetch origin main

            echo "==> Actualizando código"
            git reset --hard origin/main

            echo "==> Instalando dependencias"
            npm ci

            echo "==> Compilando HÁBITAT"
            npm run build

            echo "==> Reiniciando HÁBITAT"
            sudo supervisorctl restart habitat

            echo "==> Verificando proceso"
            sudo supervisorctl status habitat